<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة الـ Dynamic QR Codes الذكية</title>
    <meta name="description" content="منصة ويب متكاملة لتوليد وإدارة رموز QR الديناميكية الذكية مع التوجيه المباشر للتطبيقات (Deep Linking) والتفعيل السريع وحماية لوحة التحكم." />
    <meta property="og:title" content="منصة الـ Dynamic QR Codes الذكية" />
    <meta property="og:description" content="منصة ويب متكاملة لتوليد وإدارة رموز QR الديناميكية الذكية مع التوجيه المباشر للتطبيقات (Deep Linking) والتفعيل السريع وحماية لوحة التحكم." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta property="og:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var p = window.location.pathname || '';
          if (p.indexOf('/q/') === 0) {
            var qid = p.replace('/q/', '').split('?')[0].split('/')[0];
            if (qid) {
              var raw = localStorage.getItem('smart_qr_codes_local_cache');
              if (raw) {
                var c = JSON.parse(raw);
                var item = c[qid];
                if (item && item.is_active && item.target_url && item.app_type !== 'bank') {
                  var dest = item.target_url;
                  var isPhoneOnly = (item.app_type === 'wallet' && !/^https?:\/\//i.test(dest) && !dest.includes('/') && !dest.includes('.'));
                  if (!isPhoneOnly) {
                    if (dest.indexOf('http://') !== 0 && dest.indexOf('https://') !== 0 && dest.indexOf('tel:') !== 0 && dest.indexOf('intent:') !== 0) {
                      dest = 'https://' + dest;
                    }
                    window.location.replace(dest);
                  }
                }
              }
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#09090b] text-slate-100 font-sans antialiased min-h-screen selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
