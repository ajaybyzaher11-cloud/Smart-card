<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Smart Card - البطاقة الذكية</title>
    <meta name="description" content="منصة Smart Card لتوليد وإدارة رموز QR الديناميكية الذكية مع التوجيه المباشر للتطبيقات." />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Smart Card" />
    <meta property="og:title" content="Smart Card - البطاقة الذكية" />
    <meta property="og:description" content="منصة Smart Card لتوليد وإدارة رموز QR الديناميكية الذكية مع التوجيه المباشر للتطبيقات." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Ignore benign Vite dev server WebSocket disconnect notices in iFrame/proxy environments
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('vite') !== -1)) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && e.reason.message && e.reason.message.indexOf('WebSocket') !== -1) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      });
      (function() {
        try {
          var p = window.location.pathname || '';
          if (p.indexOf('/q/') === 0) {
            var qid = p.replace('/q/', '').split('?')[0].split('/')[0];
            if (qid) {
              var raw = localStorage.getItem('smart_qr_codes_local_cache');
              if (raw) {
                var c = JSON.parse(raw);
                var item = c[qid];
                if (item && item.is_active && item.target_url && item.app_type !== 'bank') {
                  var dest = item.target_url;
                  var isPhoneOnly = (item.app_type === 'wallet' && !/^https?:\/\//i.test(dest) && !dest.includes('/') && !dest.includes('.'));
                  if (!isPhoneOnly) {
                    if (dest.indexOf('http://') !== 0 && dest.indexOf('https://') !== 0 && dest.indexOf('tel:') !== 0 && dest.indexOf('intent:') !== 0) {
                      dest = 'https://' + dest;
                    }
                    window.location.replace(dest);
                  }
                }
              }
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#09090b] text-slate-100 font-sans antialiased min-h-screen selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
