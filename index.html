<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Smart Card - البطاقة الذكية</title>
    <meta name="description" content="منصة Smart Card لتوليد وإدارة رموز QR الديناميكية الذكية مع التوجيه المباشر للتطبيقات." />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Smart Card" />
    <meta property="og:title" content="Smart Card - البطاقة الذكية" />
    <meta property="og:description" content="منصة Smart Card لتوليد وإدارة رموز QR الديناميكية الذكية مع التوجيه المباشر للتطبيقات." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Filter benign Vite dev server WebSocket disconnect and Firestore backend reconnect notices in cloud iFrame/proxy
      (function() {
        var origError = console.error;
        var origWarn = console.warn;
        function isBenign(args) {
          var text = '';
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            if (!item) continue;
            text += ' ' + ((item && (item.message || item.stack)) || (typeof item === 'object' ? JSON.stringify(item) : String(item)));
          }
          return (
            text.indexOf('WebSocket') !== -1 ||
            text.indexOf('[vite]') !== -1 ||
            text.indexOf('Could not reach Cloud Firestore backend') !== -1 ||
            text.indexOf('offline mode') !== -1 ||
            text.indexOf('@firebase/firestore') !== -1
          );
        }
        console.error = function() {
          if (isBenign(arguments)) return;
          origError.apply(console, arguments);
        };
        console.warn = function() {
          if (isBenign(arguments)) return;
          origWarn.apply(console, arguments);
        };
      })();
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || (e.error && (e.error.message || e.error.stack)))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('Firestore') !== -1) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var msg = (e && e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('Firestore') !== -1 || msg.indexOf('unavailable') !== -1) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return true;
        }
      }, true);
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].update();
          }
        }).catch(function() {});
      }
      (function() {
        try {
          var p = window.location.pathname || '';
          if (p.indexOf('/q/') === 0) {
            var qid = p.replace('/q/', '').split('?')[0].split('/')[0];
            if (qid) {
              var raw = localStorage.getItem('smart_qr_codes_local_cache');
              if (raw) {
                var c = JSON.parse(raw);
                var item = c[qid];
                var isWallet = item && (item.app_type === 'wallet' || (item.wallets && item.wallets.length > 0) || (item.target_url && item.target_url.indexOf('tel:*9*7*') === 0));
                var isBank = item && (item.app_type === 'bank' || (item.target_url && item.target_url.indexOf('bank://') === 0));
                // Wallet and Bank cards must ALWAYS load the React application (SmartRedirectView)
                // and never be auto-redirected by this head script!
                if (item && item.is_active && item.target_url && !isBank && !isWallet) {
                  var dest = item.target_url;
                  if (dest.indexOf('http://') !== 0 && dest.indexOf('https://') !== 0 && dest.indexOf('tel:') !== 0 && dest.indexOf('intent:') !== 0) {
                    dest = 'https://' + dest;
                  }
                  window.location.replace(dest);
                }
              }
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#09090b] text-slate-100 font-sans antialiased min-h-screen selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
